{{- with .Values.backend.authorization }}
{{- if and $.Values.backend.enabled .enabled (not .apiKey.existingSecret) .apiKey.value }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dataspace-mgm.backend.fullname" $ }}-api-key
  labels:
    {{- include "dataspace-mgm.labels" $ | nindent 4 }}
    {{- include "dataspace-mgm.selectorLabels" (dict "ctx" $ "component" "backend") | nindent 4 }}
type: Opaque
data:
  {{ .apiKey.secretKey }}: {{ .apiKey.value | b64enc | quote }}
{{- end }}
{{- end }}
